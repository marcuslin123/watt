services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: watt
      POSTGRES_USER: watt_owner
      POSTGRES_PASSWORD: ${WATT_DB_PASSWORD:?Set WATT_DB_PASSWORD for the local database}
    ports:
      - "127.0.0.1:${WATT_DB_PORT:-55432}:5432"
    volumes:
      - watt_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "watt_owner", "-d", "watt"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  watt_postgres:
